name: Android E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and app
        run: |
          npm ci
          npm run apps:download
          npx appium driver install uiautomator2

      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            npx appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:4723/status > /dev/null
            npm run test:android

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            npm run report:allure
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-report
          path: |
            allure-results/
            allure-report/
            artifacts/screenshots/
            appium.log
          if-no-files-found: warn
          retention-days: 14